<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var k='starboundThemeV1';var m=null;try{m=localStorage.getItem(k);}catch(e){}if(m!=='light'&&m!=='dark'){try{m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){m='dark';}}document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>
<title>Page not found — STARBOUND | BundLal Studios</title>
<meta name="description" content="STARBOUND by BundLal Studios — Light every beacon. Reclaim the sky.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:system-ui,'Nunito',sans-serif;text-align:center;padding:20px}
  .card{background:#0B0B0B;border:1px solid #FFC94D;border-radius:20px;padding:32px;max-width:420px}
  img.logo{width:min(220px,60vw);height:auto;display:block;margin:0 auto 10px}
  a{display:inline-block;margin-top:16px;background:linear-gradient(180deg,#FFE9A8,#FFC94D);color:#2A1A00;font-weight:800;text-decoration:none;border-radius:14px;padding:12px 24px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="./favicon.png" alt="STARBOUND logo" width="500" height="500">
  <div>✦ STARBOUND ✦</div>
  <div style="opacity:.7"><small>BundLal Studios</small></div>
  <h1>Lost among the stars?</h1>
  <p>This path doesn't exist. Pip will guide you back to the adventure.</p>
  <a id="homeLink" href="./">← Back to the game</a>
</div>
<script>
  // Works from any GitHub Pages project subpath (e.g. /Mario/whatever):
  // go up to the repository root, which always serves index.html.
  (function () {
    try {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('homeLink').setAttribute('href', base);
      location.replace(base);
    } catch (e) { /* manual link above still works */ }
  })();
</script>
</body>
</html>
